[package]
name = "chemu8_desktop"
version = "0.1.0"
edition = "2024"
description = "A Chip8 emulator written in Rust."

[dependencies]
sdl2 = { version = "0.38.0", features = ["gfx", "ttf"] }
rand = "0.10.1"
chemu8_core = { path = "../chemu8_core" }
clap = { version = "4.6.6", features = ["derive"] }
rfd = "0.17.2"
