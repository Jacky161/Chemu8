[package]
name = "chemu8_desktop"
version = "0.1.0"
edition = "2024"
description = "A Chip8 emulator written in Rust."

[features]
default = []
static-link = ["sdl2/static-link"]
use-pkgconfig = ["sdl2/use-pkgconfig"]
use-vcpkg = ["sdl2/use-vcpkg"]

[dependencies]
sdl2 = { version = "0.38.0", features = ["gfx", "ttf"] }
rand = "0.10.1"
chemu8_core = { path = "../chemu8_core" }
clap = { version = "4.6.6", features = ["derive"] }
rfd = "0.17.2"

[package.metadata.vcpkg]
dependencies = ["sdl2", "sdl2-ttf", "sdl2-gfx"]
git = "https://github.com/microsoft/vcpkg"
rev = "2026.07.29"

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md" }
aarch64-pc-windows-msvc = { triplet = "arm64-windows-static-md" }
x86_64-unknown-linux-gnu = { triplet = "x64-linux" }
aarch64-unknown-linux-gnu = { triplet = "arm64-linux" }
x86_64-apple-darwin = { triplet = "x64-osx" }
aarch64-apple-darwin = { triplet = "arm64-osx" }
